services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: denti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: consultorio_db
      POSTGRES_USER: denti_user
      POSTGRES_PASSWORD: denti_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - denti_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denti_user -d consultorio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend (BFF - Backend for Frontend)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: denti_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://denti_user:denti_pass@db:5432/consultorio_db
      - JWT_SECRET_KEY=super-secret-production-jwt-key-change-this-in-real-deployment
      - CORS_ORIGINS=http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - denti_network
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: denti_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - denti_network

  # Nginx Reverse Proxy (Local Development)
  nginx:
    image: nginx:alpine
    container_name: denti_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - denti_network

volumes:
  postgres_data:
    driver: local

networks:
  denti_network:
    driver: bridge


