<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="barGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#C026D3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background bars -->
  <rect x="15" y="50" width="8" height="35" rx="2" fill="url(#barGradient)" opacity="0.8"/>
  <rect x="26" y="42" width="8" height="43" rx="2" fill="url(#barGradient)" opacity="0.85"/>
  <rect x="37" y="35" width="8" height="50" rx="2" fill="url(#barGradient)" opacity="0.9"/>
  <rect x="48" y="28" width="8" height="57" rx="2" fill="url(#barGradient)" opacity="0.95"/>
  <rect x="59" y="45" width="8" height="40" rx="2" fill="url(#barGradient)" opacity="0.9"/>
  <rect x="70" y="38" width="8" height="47" rx="2" fill="url(#barGradient)" opacity="0.85"/>
  <rect x="81" y="32" width="8" height="53" rx="2" fill="url(#barGradient)" opacity="0.8"/>
  
  <!-- Growth curve -->
  <path d="M 15 75 Q 30 70, 40 55 T 70 30 L 90 10" 
        stroke="url(#curveGradient)" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>
  
  <!-- Sparkles at the top -->
  <g transform="translate(80, 8)">
    <!-- Main sparkle -->
    <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z" 
          fill="#10B981" opacity="0.95">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="3s"
        repeatCount="indefinite"/>
    </path>
    <!-- Small sparkle -->
    <path d="M 8,-8 L 8.8,-6.5 L 10,-6 L 8.8,-5.5 L 8,-4 L 7.2,-5.5 L 6,-6 L 7.2,-6.5 Z" 
          fill="#10B981" opacity="0.8">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360 8 -6"
        to="0 8 -6"
        dur="2s"
        repeatCount="indefinite"/>
    </path>
  </g>
</svg>
